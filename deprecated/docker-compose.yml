services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: mise_ai_nginx
    ports:
      - "80:80"
    depends_on:
      - app
      - server
      - ml-server
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: mise_ai_frontend
    environment:
      - VITE_API_URL=/api
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mise_ai_core_backend_api
    environment:
      - DATABASE_URL=postgresql://mise_user:mise_password@postgres:5432/mise_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin
      - ML_SERVER_URL=http://ml-server:8001
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./server/:/app/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  server-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mise_ai_core_backend_worker
    command: python consumer.py
    environment:
      - DATABASE_URL=postgresql://mise_user:mise_password@postgres:5432/mise_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin
    volumes:
      - ./server/:/app/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

  ml-server:
    build:
      context: ./ml_server
      dockerfile: Dockerfile
    container_name: mise_ai_ml_server
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./ml_server/:/app/
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ml-server-worker:
    build:
      context: ./ml_server
      dockerfile: Dockerfile
    container_name: mise_ai_ml_server_worker
    command: python queue_worker.py
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./ml_server/:/app/
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: mise_ai_postgres
    environment:
      - POSTGRES_DB=mise_db
      - POSTGRES_USER=mise_user
      - POSTGRES_PASSWORD=mise_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mise_user -d mise_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mise_ai_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mise_ai_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
