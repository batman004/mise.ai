apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ml-llm-worker-scaledobject
  namespace: mise-ai
spec:
  scaleTargetRef:
    name: ml-llm-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 60
  idleReplicaCount: 1
  triggers:
  - type: rabbitmq
    metadata:
      queueName: llm_queue
      host: amqp://admin:admin@rabbitmq-service.mise-ai.svc.cluster.local:5672/
      queueLength: '10'  # Scale up when queue has 10+ messages
      messageCount: '2'  # Target 5 messages per worker
      # KEDA scaling formula: ceil(queueLength / messageCount)
      # With queueLength=10 and messageCount=2, we get 5 consumers for every 10 requests




