apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mise-ai
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "mise_db"
        - name: POSTGRES_USER
          value: "mise_user"
        - name: POSTGRES_PASSWORD
          value: "mise_password"
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - mise_user
            - -d
            - mise_db
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - mise_user
            - -d
            - mise_db
          initialDelaySeconds: 10
          periodSeconds: 10
