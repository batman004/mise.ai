apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mise-ai-ingress
  namespace: mise-ai
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers: "8"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: mise-ai.local
    http:
      paths:
      # RabbitMQ - needs path rewriting (most specific first)
      - path: /rabbitmq(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: rabbitmq-service
            port:
              number: 15672
      # ML Server - needs path rewriting  
      - path: /ml(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: ml-server-service
            port:
              number: 8001
      # API - needs path rewriting
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: core-server-service
            port:
              number: 8000
      # Frontend - serve static files (catch-all, must be last)
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend-service
            port:
              number: 80
